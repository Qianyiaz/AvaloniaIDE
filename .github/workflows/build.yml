name: build
permissions:
  contents: read
on:
  pull_request: 
    branches: [ main ]
    paths: [ 'AvaloniaIDE/**', '.github/workflows/build.yml' ]
  push:
    branches: [ main ]
    paths: [ 'AvaloniaIDE/**', '.github/workflows/build.yml' ]
jobs:
  publish:
    strategy:
      matrix:
        include:
          - platform: windows-latest
            runtime: win-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0 # Treeless clone. Slightly less performant than a shallow clone, but makes finding diffs instantaneous.
          filter: tree:0 # See: https://github.blog/open-source/git/get-up-to-speed-with-partial-clone-and-shallow-clone/
          sparse-checkout: |
            .github
            AvaloniaIDE
            AvaloniaIDE.slnx
      - uses: actions/cache@main
        with:
          path: ~/.nuget/packages
          key: nuget-cache-${{ matrix.runtime }}
      - run: dotnet publish -r ${{ matrix.runtime }} -p:PublishDir=./publish
      - uses: actions/upload-artifact@main
        with:
          name: Release-${{ matrix.runtime }}
          path: |
            **/publish
            !**/*.pdb
            !**/*.dbg
            !**/*.dSYM